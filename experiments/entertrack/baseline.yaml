MODEL:
  BACKBONE:
    TYPE: vit_tiny_patch16_224_arp
    STRIDE: 16
    CE_LOC: [0]
    CE_KEEP_RATIO: [0.7]
    CE_TEMPLATE_RANGE: CTR_POINT
  HEAD:
    TYPE: CENTER
    NUM_CHANNELS: 256
  COLLABORATION:
    TYPE: none
    SAFE_COMMIT: true
  FCVC:
    ENABLED: false
  TEACHER:
    ENABLED: false
  SAFE_COMMIT:
    ENABLED: true

TRAIN:
  SEED: 42
  EPOCH: 20
  BATCH_SIZE: 16
  ACCUMULATION: 16
  OPTIMIZER:
    TYPE: AdamW
    BETAS: [0.9, 0.999]
    EPS: 1.0e-8
    WEIGHT_DECAY: 1.0e-4
  LR:
    STUDENT: 1.0e-4
    TEACHER: 1.0e-4
  SCHEDULER:
    TYPE: linear_warmup_then_cosine
    WARMUP_EPOCHS: 1
    MIN_LR: 1.0e-6
  LOSS:
    L_cls: 1.0
    L_giou: 2.0
    L_l1: 5.0
    L_align: 0.5
    L_recon: 1.0
    L_safe: 0.5
    L_cycle: 0.1
    L_teacher_track: 0.25
  CHECKPOINT:
    SAVE_EPOCH_CHECKPOINTS: true
    EPOCH_PATTERN: epoch_%02d.pth
    INTERRUPT_INTERVAL_OPTIMIZER_STEPS: 1000
    FORMAL_TEST_CHECKPOINT: epoch_20.pth
    STUDENT_EXPORT: fcvc_student_epoch20.pth

DATA:
  TRAIN:
    DATASET: threemdot_train
    SPLIT: official_train
    RECEIVER_CASES: 36132
    MANIFEST: output/multi_agent_collaboration_clean/fcvc_manual_run/full_train_receiver_manifest.csv
  TEST:
    DATASET: threemdot_test
  SAMPLER:
    REPLACEMENT: false
    HARD_MINING: false
    OLD_FAILURE_TARGET_WEIGHTING: false
    ONE_VISIT_PER_CASE_PER_EPOCH: true
    SYNC_ABC_GROUP_BOUND: true
    STEPS_PER_EPOCH: 2259
    TOTAL_STEPS: 45180
  PROCESSING:
    TEMPLATE_FACTOR: 2.0
    TEMPLATE_SIZE: 128
    SEARCH_FACTOR: 4.0
    SEARCH_SIZE: 256
    PRECISION: FP32

TEST:
  DATASET: threemdot_test
  EPOCH: 20
  SAFE_COMMIT: true
  SAVE_RESULTS: true
