DATA:
  MAX_SAMPLE_INTERVAL: 200
  MEAN:
  - 0.485
  - 0.456
  - 0.406
  SEARCH:
    CENTER_JITTER: 4.5
    FACTOR: 5.0
    SCALE_JITTER: 0.5
    SIZE: 256
    NUMBER: 1
  STD:
  - 0.229
  - 0.224
  - 0.225
  TEMPLATE:
    CENTER_JITTER: 0
    FACTOR: 2.0
    NUMBER: 1
    SCALE_JITTER: 0
    SIZE: 128
  TRAIN:
    DATASETS_NAME:
    - THREEMDOT
    DATASETS_RATIO:
    - 1
    SAMPLE_PER_EPOCH: 30000
  VAL:
    DATASETS_NAME:
    - THREEMDOT_VAL
    DATASETS_RATIO:
    - 1
    SAMPLE_PER_EPOCH: 3000
MODEL:
  PRETRAIN_FILE: "tiny_7_OSTrack_ep0300.pth.tar"
  EXTRA_MERGER: False
  RETURN_INTER: False
  PCUM:
    ENABLED: True
    LOCAL_ONLY: False
    TOKEN_DIM: 192
    PROMPT_DIM: 192
    NUM_PROMPTS: 4
    TOPK: 16
    SALIENCY_SOURCE: feature_norm
    FUSION: film
    ALIGN_GATE: cosine
    FUSION_INIT_SCALE: 0.01
  BACKBONE:
    TYPE: vit_tiny_patch16_224_arp
    STRIDE: 16
    CE_LOC: [0]
    CE_KEEP_RATIO: [0.7]
    CE_TEMPLATE_RANGE: 'CTR_POINT'
  HEAD:
    TYPE: CENTER
    NUM_CHANNELS: 256
TRAIN:
  BACKBONE_MULTIPLIER: 0.03
  DROP_PATH_RATE: 0.1
  CE_START_EPOCH: 20
  CE_WARM_EPOCH: 80
  BATCH_SIZE: 8
  EPOCH: 40
  GIOU_WEIGHT: 2.0
  L1_WEIGHT: 5.0
  FOCAL_WEIGHT: 1.0
  FLOPS_WEIGHT: 0.0
  GRAD_CLIP_NORM: 0.1
  LR: 0.0003
  LR_DROP_EPOCH: 30
  NUM_WORKER: 8
  OPTIMIZER: ADAMW
  PRINT_INTERVAL: 50
  RESUME: False
  PCUM:
    ALIGN_LOSS_WEIGHT: 0.005
    USE_PSEUDO_REMOTE: False
    USE_REAL_MULTIVIEW: True
    REAL_MULTIVIEW_LOSS_MODE: target_view
    DETACH_REAL_REMOTE: True
    STOP_GRAD_TEACHER: True
  SCHEDULER:
    TYPE: step
    GAMMA: 0.1
  VAL_EPOCH_INTERVAL: 1
  WEIGHT_DECAY: 0.0001
  AMP: False
TEST:
  SAVE_DIR: "output/pcum_real_target_v1"
  EPOCH: 40
  CHECKPOINT_NAME: pcum_real_target_film
  SEARCH_FACTOR: 4.0
  SEARCH_SIZE: 256
  TEMPLATE_FACTOR: 2.0
  TEMPLATE_SIZE: 128
